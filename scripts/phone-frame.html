<!doctype html>
<!-- Renders a page inside a 390x844 iframe: headless Chrome can't make a window narrower
     than ~500px, so phone screenshots are taken through this frame and cropped. -->
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #fff; }
  iframe { display: block; width: 390px; height: 844px; border: 0; }
</style>
<iframe id="f"></iframe>
<script>
  document.getElementById('f').src = new URLSearchParams(location.search).get('src')
</script>
