name: Bug report
description: Something looks or behaves wrong.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: e.g. dropdown-menu
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Style / mode / browser
      placeholder: e.g. manga, dark, Safari 18 on iPhone
  - type: textarea
    id: repro
    attributes:
      label: Steps or a link to reproduce
